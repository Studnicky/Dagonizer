<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Cartographer: Dagonizer demo</title>
    <style>
      /*
       * Fallback values for the CSS custom properties `CartographerRunner.vue`
       * (and the docs component kit it mounts: DagGraph, PanesTabs,
       * AboxAccordion, Spinner) read from the VitePress theme. Values mirror
       * `docs/.vitepress/theme/iridis.palette.css` and `palette.css` so the
       * standalone app renders with the same dark palette as the docs page,
       * without depending on VitePress at runtime.
       */
      :root {
        color-scheme: dark;
        --dagonizer-bg:      #04060a;
        --dagonizer-bg-alt:  #0e1525;
        --dagonizer-bg-elv:  #020306;
        --dagonizer-bg-soft: #0e1525;
        --dagonizer-text:    #eef3f7;
        --dagonizer-text2:   #c9d0d8;
        --dagonizer-text3:   #7a8290;
        --dagonizer-divider: #7a8290;
        --dagonizer-brand:   #22e8ff;
        --dagonizer-brand2:  #8f6dff;
        --dagonizer-brand3:  #d4a649;

        --vp-c-bg:       var(--dagonizer-bg);
        --vp-c-bg-alt:   var(--dagonizer-bg-alt);
        --vp-c-bg-elv:   var(--dagonizer-bg-elv);
        --vp-c-bg-soft:  var(--dagonizer-bg-soft);
        --vp-c-text-1:   var(--dagonizer-text);
        --vp-c-text-2:   var(--dagonizer-text2);
        --vp-c-text-3:   var(--dagonizer-text3);
        --vp-c-divider:  var(--dagonizer-divider);
        --vp-c-border:   var(--dagonizer-divider);
        --vp-c-brand-1:  var(--dagonizer-brand);
        --vp-c-brand-2:  var(--dagonizer-brand2);
        --vp-c-brand-3:  var(--dagonizer-brand3);

        --vp-font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --vp-font-family-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: var(--vp-font-family-base);
        background: var(--vp-c-bg);
        color: var(--vp-c-text-1);
      }
      #app {
        min-height: 100vh;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
